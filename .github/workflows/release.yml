name: Release

# Builds the portable Windows exe with the MinGW/GNU toolchain described in
# README.md and attaches the ZIP to a GitHub Release whenever a v* tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (GNU toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW on PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"
          gcc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build noterust.exe
        run: cargo build --release -p noterust --features custom-protocol

      - name: Package portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $dir = "NoteRust-$version-portable-win64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/x86_64-pc-windows-gnu/release/noterust.exe" "$dir/NoteRust.exe"
          Copy-Item "packaging/README.txt" "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_FILE=$dir.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: NoteRust ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            نسخة Windows محمولة (64-bit)، بلا تثبيت: فك ضغط الملف وشغّل `NoteRust.exe`
            من أي مكان. تحتاج WebView2 Runtime (مثبَّت في Windows 11 وأغلب أجهزة Windows 10).

            الملف غير موقَّع رقمياً، لذا قد يظهر تحذير SmartScreen عند أول تشغيل.
          files: ${{ env.ZIP_FILE }}
