name: Release

# Builds the app on Windows (MinGW/GNU toolchain + NSIS installer) and Linux
# (deb + AppImage), then attaches every artefact to a GitHub Release whenever a
# v* tag is pushed.
on:
  push:
    tags:
      - "v*"
  # Manual runs build the app without publishing a release (used to verify CI).
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  windows:
    name: Windows (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (GNU toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\mingw64\bin"

      # The resource build script (embed-resource) picks windres or the MSVC
      # rc.exe from the *host* toolchain, not the target one. With the default
      # MSVC host it emits a resource.lib the MinGW linker cannot read, so the
      # whole toolchain has to be the GNU one, exactly like a local build.
      - name: Install Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal `
            --target x86_64-pc-windows-gnu --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # rust-toolchain.toml names the "stable" channel, which rustup resolves to
      # its own MSVC host no matter what the default toolchain is, so the host
      # is forced through the environment instead.
      - name: Build exe
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          "== gcc ==" | Tee-Object -FilePath build-windows.log
          gcc --version 2>&1 | Tee-Object -FilePath build-windows.log -Append
          "== rustc -vV ==" | Tee-Object -FilePath build-windows.log -Append
          $info = rustc -vV
          $info | Tee-Object -FilePath build-windows.log -Append
          "== tauri build ==" | Tee-Object -FilePath build-windows.log -Append
          if (($info -join "`n") -notmatch "host: x86_64-pc-windows-gnu") { throw "rustc host is not windows-gnu" }
          tauri build --target x86_64-pc-windows-gnu --no-bundle --verbose 2>&1 |
            Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle installers
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updater artifacts are signed only when the signing key is available,
          # so a fork without the secret can still build the app.
          $cfg = @()
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Set-Content -Path updater-ci.json -Encoding utf8NoBOM `
              -Value '{"bundle":{"createUpdaterArtifacts":true}}'
            $cfg = @("--config", "updater-ci.json")
          }
          tauri bundle --target x86_64-pc-windows-gnu --bundles "nsis,msi" --verbose @cfg 2>&1 |
            Tee-Object -FilePath build-windows.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build log
        if: failure()
        shell: pwsh
        run: |
          $log = "build-windows.log"
          if (-not (Test-Path $log)) { Write-Output "no build log was produced"; exit 0 }
          $head = (Get-Content $log -TotalCount 60) -join "`n"
          $tail = (Get-Content $log -Tail 300) -join "`n"
          if ($tail.Length -gt 50000) { $tail = $tail.Substring($tail.Length - 50000) }
          $payload = @{
            title = "Windows CI log (${{ github.run_id }})"
            body  = "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n" +
                    "### Start`n``````text`n" + $head + "`n`````` `n### End`n``````text`n" + $tail + "`n``````"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/issues" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" } `
            -ContentType "application/json" `
            -Body $payload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable build
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev" }
          $dir = "NoteRust-$version-portable-win64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/x86_64-pc-windows-gnu/release/noterust.exe" "$dir/NoteRust.exe"
          Copy-Item "packaging/README.txt" "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            NoteRust-*-portable-win64.zip
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-gnu/release/bundle/nsis/*.sig
            target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
            target/x86_64-pc-windows-gnu/release/bundle/msi/*.sig

  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            rpm \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # .cargo/config.toml pins the Windows GNU target for local builds, so the
      # Linux job must name its own target explicitly.
      - name: Build deb and AppImage
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cfg=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater-ci.json
            cfg=(--config updater-ci.json)
          fi
          tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage,rpm "${cfg[@]}" --verbose 2>&1 |
            tee build-linux.log

      - name: Report build log
        if: failure()
        shell: bash
        run: |
          [ -f build-linux.log ] || { echo "no build log was produced"; exit 0; }
          tail_out=$(tail -n 400 build-linux.log)
          python3 - "$tail_out" <<'PY'
          import json, os, sys, urllib.request
          tail = sys.argv[1][-55000:]
          body = f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n```text\n{tail}\n```"
          data = json.dumps({"title": f"Linux CI log ({os.environ['GITHUB_RUN_ID']})", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=data,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req)
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

  release:
    name: Publish release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact keeps the path relative to the workspace root, so the
      # installer and Linux packages arrive in nested folders. Flatten them to
      # one directory; otherwise `files: dist/*` silently publishes only the
      # portable zip (the v1.0.6 release).
      - name: Flatten assets
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp -v -t release-assets {} +
          ls -la release-assets

      # The updater compares the running version against this manifest and
      # downloads the signed artifact it points at.
      - name: Build updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"

          def signature(path):
              with open(path, encoding="utf-8") as handle:
                  return handle.read().strip()

          candidates = {}
          for path in glob.glob("release-assets/*.sig"):
              asset = os.path.basename(path)[:-4]
              if asset.endswith(".AppImage"):
                  key, rank = "linux-x86_64", 0
              elif asset.endswith(".nsis.zip"):
                  key, rank = "windows-x86_64", 0
              elif asset.endswith("-setup.exe"):
                  key, rank = "windows-x86_64", 1
              else:
                  continue
              best = candidates.get(key)
              if best is None or rank < best[0]:
                  candidates[key] = (rank, asset, signature(path))

          if not candidates:
              print("no signed updater artifacts; skipping latest.json")
              raise SystemExit(0)

          version = tag.lstrip("v")
          manifest = {
              "version": version,
              "notes": f"NoteRust {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  key: {"signature": sig, "url": f"{base}/{asset}"}
                  for key, (_rank, asset, sig) in candidates.items()
              },
          }
          with open("release-assets/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          print(open("release-assets/latest.json", encoding="utf-8").read())
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: NoteRust ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Windows** — `NoteRust_<version>_x64-setup.exe` هو المثبّت (ويوجد أيضاً
            `NoteRust_<version>_x64_en-US.msi`)، و`NoteRust-<version>-portable-win64.zip`
            نسخة محمولة بلا تثبيت. التطبيق يحتاج WebView2 Runtime (مثبَّت افتراضياً في
            Windows 11 وأغلب أجهزة Windows 10).

            المثبّت يسجّل NoteRust في «فتح باستخدام» و«التطبيقات الافتراضية»، ويجعل
            ملفات txt/log/md/csv تُفتح به. لتأكيده كافتراضي بدل Notepad: افتح
            الإعدادات ← التطبيقات ← التطبيقات الافتراضية ← NoteRust ← اختر .txt ←
            «تعيين كافتراضي» (ويندوز يمنع تغيير الافتراضي بصمت).

            **Linux** — حزمة `.deb` لأوبونتو/دبيان، و`.rpm` لفيدورا/ريد هات، و`.AppImage`
            يعمل على أي توزيعة بعد `chmod +x` (يحتاج `libwebkit2gtk-4.1`).

            الملفات غير موقَّعة رقمياً، لذا قد يظهر تحذير SmartScreen على ويندوز عند أول تشغيل.
          files: release-assets/*
