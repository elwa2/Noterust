[package]
name = "noterust-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noterust-core = { workspace = true }
noterust-search = { path = "../search" }
noterust-crypto = { path = "../crypto" }
rusqlite = { version = "0.41", features = ["bundled", "backup", "functions"] }
rusqlite_migration = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
