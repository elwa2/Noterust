[package]
name = "noterust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NoteRust — تطبيق ملاحظات عربي لسطح المكتب"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Restores window size/position/maximized state across launches.
tauri-plugin-window-state = "2"
# In-app updates: verifies signed builds published on GitHub releases.
tauri-plugin-updater = "2"
# Restarts the app after an update is installed.
tauri-plugin-process = "2"
noterust-core = { workspace = true }
noterust-db = { workspace = true }
noterust-fileio = { workspace = true }
noterust-crypto = { workspace = true }
noterust-search = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# Talks to local AI servers (Ollama, LM Studio) and cloud providers.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
directories = "6"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Shell integration: file associations, autostart and the WebView2 check.
winreg = "0.55"
# Statically links Microsoft's WebView2 loader, so the portable exe needs no DLL.
webview2-com-sys = "0.39"

[features]
default = []
# Embeds ../ui/dist into the binary instead of pointing at the dev server.
# Required for any release build: cargo build --release -p noterust --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]
